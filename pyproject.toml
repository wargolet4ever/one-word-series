[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "one-word-series"
version = "0.1.0"
description = "One word in, a whole series out — with the continuity written down."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mona L." }]
keywords = ["ai-video", "film", "series", "continuity", "seedance", "storyboard"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "Pillow>=10.2.0,<13",
  "imageio-ffmpeg>=0.5.1,<0.7",
]

[project.optional-dependencies]
# The Continuity-Agent verifier, for checks deeper than the built-in
# three-frame audit.  Entirely optional — nothing here requires it.
continuity = [
  "continuity-agent @ git+https://github.com/wargolet4ever/Continuity-Agent.git",
]

[project.urls]
Homepage = "https://github.com/wargolet4ever/one-word-series"
Verifier = "https://github.com/wargolet4ever/Continuity-Agent"

[project.scripts]
oneword = "oneword.cli:main"

[tool.setuptools]
packages = ["oneword"]
